name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: farmexpress
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm run install:all

      - name: Generate Prisma client & apply migrations
        working-directory: server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/farmexpress?schema=public
          JWT_SECRET: ci-test-secret-key-at-least-32-characters-long
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npm run seed

      - name: Run API test suite
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/farmexpress?schema=public
          JWT_SECRET: ci-test-secret-key-at-least-32-characters-long
        run: npm test

      - name: Build server and client
        run: npm run build
