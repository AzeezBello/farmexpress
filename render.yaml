services:
  - type: web
    name: farmexpress-api
    runtime: node
    rootDir: server
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run seed && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: farmexpress-db
          property: connectionString

databases:
  - name: farmexpress-db
    plan: free
